<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шабытпен стрим жүргізетіндер · Шабыт</title>
<meta name="description" content="Kaspi донат алерттерін Шабытпен қосқан стримерлер: TikTok, Twitch, YouTube, Kick.">
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 600px at 10% -10%,#12404f 0,transparent 60%),radial-gradient(900px 500px at 100% 0,#2a1550 0,transparent 55%),#061820;color:#e8f6fa;font:16px/1.5 Montserrat,system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.logo{display:flex;align-items:center;gap:10px;font:700 22px Unbounded,sans-serif;text-decoration:none}
.logo img{width:34px;height:34px}
.lang{display:flex;border:1px solid #1d4352;border-radius:12px;overflow:hidden}
.lang button{border:0;background:transparent;color:#9fbcc6;font:700 13px Montserrat,sans-serif;padding:8px 12px;cursor:pointer}
.lang button[aria-pressed=true]{background:#22c3dd;color:#061820}
h1{margin:26px 0 8px;font:800 clamp(28px,5vw,50px)/1.1 Unbounded,sans-serif;background:linear-gradient(180deg,#fff7d1,#fec50c 60%,#ff9d00);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:680px;color:#9fbcc6;font-size:18px;margin:0 0 22px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.tools input{flex:1 1 260px;min-width:0;padding:13px 16px;border-radius:14px;border:1px solid #1d4352;background:#0c2630;color:#e8f6fa;font:600 16px Montserrat,sans-serif}
.tools .n{color:#9fbcc6;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;margin-bottom:34px}
.c{position:relative;display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:linear-gradient(160deg,#0f3140,#0a222c);border:1px solid #1d4352;transition:transform .2s,border-color .2s}
.c:hover{transform:translateY(-3px);border-color:#fec50c}
.c .hd{display:flex;align-items:center;gap:12px;min-width:0}
.av{flex:none;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font:800 24px Unbounded,sans-serif;color:#fff;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 0 0 3px rgba(255,255,255,.12)}
.nm{min-width:0}
.nm b{display:block;font:700 18px/1.2 Unbounded,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{display:inline-flex;gap:6px;align-items:center;margin-top:4px;font-size:13px;font-weight:700;color:#9fbcc6}
.pro{position:absolute;top:14px;right:14px;padding:3px 9px;border-radius:999px;background:#fec50c;color:#2a1d00;font:800 11px Unbounded,sans-serif}
.ab{margin:0;color:#cfeef6;font-size:15px;min-height:22px;overflow-wrap:anywhere}
.go{margin-top:auto;display:block;text-align:center;padding:12px;border-radius:12px;background:#22c3dd;color:#061820;font-weight:800;text-decoration:none}
.go:hover{background:#fec50c}
.empty{padding:40px 20px;text-align:center;color:#9fbcc6;border:1px dashed #1d4352;border-radius:20px;margin-bottom:34px}
.cta{display:flex;gap:20px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:26px;border-radius:24px;background:linear-gradient(110deg,rgba(254,197,12,.18),rgba(34,195,221,.12));border:1px solid rgba(254,197,12,.5);margin-bottom:40px}
.cta h2{margin:0 0 6px;font:700 24px/1.2 Unbounded,sans-serif}
.cta p{margin:0;color:#cfeef6;max-width:640px}
.cta a{flex:none;padding:15px 24px;border-radius:14px;background:#fec50c;color:#2a1d00;font:800 16px Unbounded,sans-serif;text-decoration:none}
:focus-visible{outline:3px solid #22c3dd;outline-offset:2px}
footer{padding:20px 0 40px;color:#9fbcc6;font-size:14px}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="/"><img src="https://shabyt-api.timabektimabekk.workers.dev/static/logo.svg" alt="">Шабыт</a>
<div class="lang" role="group" aria-label="Тіл / Язык"><button type="button" data-l="kk">ҚАЗ</button><button type="button" data-l="ru">РУС</button></div></header>
<main id="m"><p class="lead">…</p></main>
<footer>© Шабыт · <a href="/">shabytkzdon.com</a></footer>
</div>
<script>
(() => {
  const API = 'https://shabyt-api.timabektimabekk.workers.dev';
  const T = {
    kk: { title: 'Шабытпен стрим жүргізетіндер', lead: 'Бұл стримерлер Kaspi донаттарын Шабыт арқылы қабылдайды: эфирде алерт, топ донатерлер, музыка тапсырысы. Кіріп, қолдау көрсетіңіз!',
      find: 'Ник бойынша іздеу…', n: n => `${n} стример`, go: 'Стримге өту ↗', none: 'Әзірге ешкім жоқ. Бірінші болыңыз!', notFound: 'Ештеңе табылмады.', err: 'Тізімді жүктеу мүмкін болмады. Бетті жаңартыңыз.',
      ctaH: 'Сен де стримерсің бе?', ctaP: 'Шабытты тегін қос: Kaspi-ге ақша түссе, эфирде бірден алерт шығады. Тізімге кабинеттегі «Жарнама · Бонус» бетінен қосыласың.', ctaB: 'Тегін бастау' },
    ru: { title: 'Стримеры на Шабыте', lead: 'Эти стримеры принимают донаты Kaspi через Шабыт: алерты в эфире, топ донатеров, заказ музыки. Заходите и поддерживайте!',
      find: 'Поиск по нику…', n: n => `${n} стример${n % 10 === 1 && n % 100 !== 11 ? '' : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 12 || n % 100 > 14) ? 'а' : 'ов'}`, go: 'Перейти на стрим ↗', none: 'Пока никого нет. Будьте первым!', notFound: 'Ничего не найдено.', err: 'Не удалось загрузить список. Обновите страницу.',
      ctaH: 'Ты тоже стример?', ctaP: 'Подключи Шабыт бесплатно: пришли деньги на Kaspi — алерт сразу в эфире. В список добавляешься в кабинете, на странице «Реклама · Бонус».', ctaB: 'Начать бесплатно' }
  };
  let lang = (() => { try { return localStorage.getItem('shabyt-lang') || ((navigator.language || '').startsWith('ru') ? 'ru' : 'kk'); } catch (e) { return 'kk'; } })();
  let list = null, failed = false, q = '';
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const PAL = [['#c45cff', '#6a1fff'], ['#ff6fd8', '#c45cff'], ['#22c3dd', '#0a6c8a'], ['#fec50c', '#ff7a1a'], ['#3dff8e', '#0a8a4a'], ['#ff7a5c', '#c4153d']];
  const col = s => { let h = 0; for (const ch of s) h = (h * 31 + ch.codePointAt(0)) >>> 0; return PAL[h % PAL.length]; };
  const card = s => { const [a, b] = col(s.name), ini = esc(([...s.name.trim()][0] || '?').toUpperCase());
    return `<article class="c">${s.pro ? '<span class="pro">PRO</span>' : ''}<div class="hd"><div class="av" style="--a:${a};--b:${b}" aria-hidden="true">${ini}</div><div class="nm"><b>${esc(s.name)}</b><span class="pl">${esc(s.platform)}</span></div></div>
      <p class="ab">${esc(s.about)}</p><a class="go" href="${esc(s.link)}" target="_blank" rel="noopener nofollow ugc">${T[lang].go}</a></article>`; };
  const listHtml = () => {
    const x = T[lang]; if (failed) return `<div class="empty">${x.err}</div>`; if (!list) return '';
    const f = q ? list.filter(s => (s.name + ' ' + s.platform + ' ' + s.about).toLowerCase().includes(q)) : list;
    return f.length ? `<div class="grid">${f.map(card).join('')}</div>` : `<div class="empty">${list.length ? x.notFound : x.none}</div>`;
  };
  const render = () => {
    const x = T[lang]; document.documentElement.lang = lang; document.title = x.title + ' · Шабыт';
    document.querySelectorAll('[data-l]').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
    document.getElementById('m').innerHTML = `<h1>${x.title}</h1><p class="lead">${x.lead}</p>
      <div class="tools"><input id="q" type="search" placeholder="${x.find}" aria-label="${x.find}" value="${esc(q)}"><span class="n">${list ? x.n(list.length) : ''}</span></div>
      <div id="ls">${listHtml()}</div>
      <section class="cta"><div><h2>${x.ctaH}</h2><p>${x.ctaP}</p></div><a href="/account/">${x.ctaB}</a></section>`;
  };
  document.addEventListener('click', e => { const b = e.target.closest('[data-l]'); if (!b) return; lang = b.dataset.l; try { localStorage.setItem('shabyt-lang', lang); } catch (er) { } render(); });
  document.addEventListener('input', e => { if (e.target.id !== 'q') return; q = e.target.value.trim().toLowerCase(); document.getElementById('ls').innerHTML = listHtml(); });
  render();
  fetch(API + '/showcase').then(r => r.ok ? r.json() : Promise.reject()).then(j => { list = j.streamers || []; render(); }).catch(() => { failed = true; render(); });
})();
</script>
</body>
</html>
