<style>
.pv{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#0b2b3a;box-shadow:0 0 0 5px #0b1d26}
.pv iframe{position:absolute;left:0;top:0;width:1920px;height:1080px;border:0;transform-origin:0 0}
.pvt{aspect-ratio:8/9;width:100%;max-width:400px;margin:0 auto}.pvt iframe{width:800px;height:900px}
.sticky{position:sticky;top:16px;display:grid;gap:12px}
.wl{display:grid;gap:10px}
.wi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.wi[aria-current=true]{border-color:var(--sky);background:var(--skyf)}
.wi .linkbox{grid-column:1/-1}
.wi h3{font-size:16px}
.wi p{margin:2px 0 0;color:var(--mute);font-size:13px}
.sw{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sw button{width:40px;height:40px;border-radius:50%;border:3px solid transparent;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
.sw button[aria-pressed=true]{border-color:var(--ink)}
.timerbox{display:flex;gap:8px;flex-wrap:wrap}
.code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--skyf);border-radius:10px;padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;margin:0}
.dg{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dc{border:2px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surf);display:flex;flex-direction:column}
.dc[aria-current=true]{border-color:var(--sky)}
.dc .pvw{position:relative;aspect-ratio:640/440;overflow:hidden;background:#0b2b3a}
.dc .pvw iframe{position:absolute;left:0;top:0;width:640px;height:440px;border:0;transform-origin:0 0;pointer-events:none}
.dc .meta{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px}
.dc .acts{padding:0 12px 12px}
.dc .acts .btn{width:100%}
.tag{font:700 12px Montserrat;border-radius:6px;padding:2px 8px}
.tag.free{background:var(--skyf)}
.tag.pro{background:var(--gold);color:var(--goldi)}
.tag.std{background:light-dark(#e6defc,#2b2152);color:light-dark(#3b2a8a,#d9ceff)}
@media(max-width:1000px){.sticky{position:static}}
</style>

plan(){const x=t(),u=ME.user,act=u.plan!=='free'&&u.plan_until>Date.now();
  if(ME.local){const tr=ME.tier||'free',P=ME.pay||{};return `<div class="head"><div><h1>${x.plTitle(x.tierN[tr])}</h1><p>${tr!=='free'?x.lpUntil(dstr(u.plan_until)):x.lpFree}</p></div></div>
  ${acctCard()}<div class="plans">${['free','std','pro'].map(k=>`<div class="pl ${tr===k?'cur':''}"><h2>${x.tierN[k]}</h2><div class="num">${fmt(ME.prices[k])} ${k!=='free'?`<small class="hint">${x.month}</small>`:''}</div><ul>${x.lfeats[k].map(f=>`<li>${f}</li>`).join('')}</ul></div>`).join('')}</div>
  <div class="grid2" style="margin-top:16px"><div class="card"><h2>${x.lpHow}</h2><ol style="margin:0;padding-left:20px;display:grid;gap:8px">${x.lpSteps(esc(P.tg||'')).map(s=>`<li>${s}</li>`).join('')}</ol><a class="btn gold" style="width:max-content" href="https://t.me/${encodeURIComponent(P.tg||'')}" target="_blank" rel="noopener">${x.lpTg}</a><label class="f" style="margin:0">${x.lpDev}</label><div class="linkbox"><code style="font-size:20px;letter-spacing:.08em">${esc(ME.device||'')}</code><button class="btn sm" data-a="copy" data-v="${esc(ME.device||'')}">${x.copy}</button></div><p class="hint">${x.lpDevHint}</p></div>
  <form class="card" id="licF" novalidate><h2>${x.lpKey}</h2><p class="hint">${x.lpKeyHint}</p><label class="f" for="lic-key" style="margin:0">${x.lpKey}</label><textarea id="lic-key" rows="4" placeholder="SHB1.…" spellcheck="false" autocomplete="off" style="font:13px ui-monospace,Consolas,monospace;word-break:break-all"></textarea><div><button class="btn gold" type="submit">${x.lpAct}</button></div></form></div>`}
  return `<div class="head"><div><h1>${x.plTitle(x[u.plan])}</h1><p>${act?x.until(dstr(u.plan_until)):x.forever}</p></div></div>${ME.pendingPlan?`<div class="banner">${x.pendPlan(x[ME.pendingPlan])}</div>`:''}
  <div class="plans">${['free','std','pro'].map(k=>`<div class="pl ${u.plan===k?'cur':''}"><h2>${x[k]}</h2><div class="num">${fmt(ME.prices[k])} ${k!=='free'?`<small class="hint">${x.month}</small>`:''}</div><ul>${x.feats[k].map(f=>`<li>${f}</li>`).join('')}</ul>${k!=='free'?`<button class="btn ${u.plan===k?'':'gold'}" data-a="buy" data-v="${k}" ${ME.pendingPlan?'disabled':''}>${u.plan===k?x.extend:x.choose}</button>`:''}</div>`).join('')}</div>
  <div class="card" id="payBox" style="margin-top:16px;display:none"></div>`},
bridge(){const x=t(),url=`${origin}/api/hook/${ME.hookKey}`,res=r=>{const [k,a]=r.split(':');return (x.brRes[k]||k)+(a?' · '+fmt(+a):'')};
  if(ME.local)return `<div class="head"><div><h1>${x.lsTitle}</h1></div></div><div class="grid2"><div class="stackv">${lsCard()}${lanCard()}<div class="card"><ol style="margin:0;padding-left:20px;display:grid;gap:8px">${x.lsSteps.map(s=>`<li>${s}</li>`).join('')}</ol><p class="hint" style="margin-top:6px">${x.lsPhone}</p></div></div><div class="card"><h2>${x.brLog}</h2>${HOOKLOG&&HOOKLOG.length?`<div class="tw"><table class="stack"><tbody>${HOOKLOG.map(r=>`<tr><td data-l="${x.hTime}" class="d">${tstr(r.created)}</td><td data-l="${x.hMsg}" style="overflow-wrap:anywhere"><b>${esc(r.title)}</b><br>${esc(r.text)}</td><td data-l="${x.hStatus}"><span class="${/^(matched|new|test)/.test(r.result)?'ok':'wait'}">${esc(res(r.result))}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${x.brEmpty}</div>`}</div></div>`;
  return `<div class="head"><div><h1>${x.brTitle}</h1><p>${x.brSub}</p></div></div><div class="grid2"><div class="card"><ol style="margin:0;padding-left:20px;display:grid;gap:8px">${x.brSteps.map(s=>`<li>${s}</li>`).join('')}</ol><label class="f" style="margin:0">${x.brUrl}</label><div class="linkbox"><code>${esc(url)}</code><button class="btn" data-a="copy" data-v="${esc(url)}">${x.copy}</button></div><p class="hint">${x.brNote}</p></div>
  <div class="card"><h2>${x.brLog}</h2>${HOOKLOG&&HOOKLOG.length?`<div class="tw"><table class="stack"><tbody>${HOOKLOG.map(r=>`<tr><td data-l="${x.hTime}" class="d">${tstr(r.created)}</td><td data-l="${x.hMsg}" style="overflow-wrap:anywhere"><b>${esc(r.title)}</b><br>${esc(r.text)}</td><td data-l="${x.hStatus}"><span class="${/^(matched|new|test)/.test(r.result)?'ok':'wait'}">${esc(res(r.result))}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${x.brEmpty}</div>`}</div></div>`}
};

const render=()=>{document.documentElement.lang=getLang();if(!ME){authView();return}shell();$('main').innerHTML=(UPD?`<div class="banner" role="status" style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">${UPDING?esc(t().updGoing):`${t().updNew(esc(UPD))} <button class="btn sm" data-a="upd">${t().updNow}</button> <a href="${SITE}" target="_blank" rel="noopener" style="color:inherit">${t().updDl}</a>`}</div>`:'')+V[view]();document.querySelectorAll('form').forEach(f=>f.noValidate=true);document.querySelectorAll('[data-pv],[data-dpv]').forEach(b=>pvObs.observe(b));fitPv();document.querySelectorAll('[data-mupv]').forEach(f=>{f.style.transform=`scale(${f.parentElement.clientWidth/800})`})};
// the program checks the site for a newer version (Shabyt.exe only)
const SITE='https://shabytkzdon.com/';let UPD=null,UPDING=false;
const vnum=s=>String(s||'').replace(/^v/,'').split('.').map(n=>parseInt(n,10)||0);
const newer=(a,b)=>{const x=vnum(a),y=vnum(b);for(let i=0;i<Math.max(x.length,y.length);i++){if((x[i]||0)!==(y[i]||0))return (x[i]||0)>(y[i]||0)}return false};
const checkUpd=async()=>{if(!ME||!ME.local||!ME.version||ME.phone)return;try{let tag=sessionStorage.getItem('shabytLatest');if(!tag){const r=await fetch('https://api.github.com/repos/timabektimabekk-beep/shabyt-site/releases/latest',{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)return;tag=String((await r.json()).tag_name||'');sessionStorage.setItem('shabytLatest',tag)}if(newer(tag,ME.version)){UPD=tag;render()}}catch(e){}};
const loadDon=async()=>{DON=await api('GET','/api/donations'+(ui.per!=='0'?'?days='+ui.per:''))};
const reload=async()=>{ME=await api('GET','/api/me');if(ME.remote&&ME.localOrigin)origin=ME.localOrigin;setViews();await loadDon()};
const route=async()=>{const h=location.hash.slice(1);view=VIEWS.includes(h)?h:'home';if(ME&&(view==='home'||view==='donations')){try{await loadDon()}catch(e){}}if(ME&&view==='alerts')await loadMedia();if(ME&&view==='music')await loadMus();if(ME&&view==='bridge'){try{HOOKLOG=(await api('GET','/api/hook-log')).rows}catch(e){}if(ME.local&&!ME.phone){try{LANI=await api('GET','/api/lan')}catch(e){}}}if(ME&&ME.local){try{ME.listener=(await api('GET','/api/me')).listener}catch(e){}}if(ME)render();window.scrollTo(0,0)};
window.addEventListener('hashchange',route);
const saveS=async(data,rerender=true)=>{try{const r=await api('PUT','/api/settings',data);ME.settings=r.settings;toast(t().saved);if(rerender)render()}catch(e){toast(errMsg(e))}};

document.addEventListener('click',async e=>{
  const lb=e.target.closest('[data-lang]');if(lb){setLang(lb.dataset.lang);render();return}
  const sg=e.target.closest('[data-seg]');if(sg){sg.parentNode.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===sg));if(sg.dataset.seg==='per'){ui.per=sg.dataset.v;await loadDon();render()}if(sg.dataset.seg==='dw'){ui.dw=sg.dataset.v;render()}return}
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,x=t(),id=b.dataset.id;
  try{
    if(a==='auth-switch'){e.preventDefault();authMode=authMode==='login'?'register':'login';authView()}
    else if(a==='logout'){if(ME&&ME.local){try{await api('POST','/api/quit')}catch(er){}document.body.innerHTML=`<main style="min-height:100vh;display:grid;place-items:center;padding:24px;font:600 18px Montserrat,system-ui,sans-serif;text-align:center"><p>${esc(x.quitDone)}</p></main>`;return}await api('POST','/api/auth/logout');ME=null;render()}
    else if(a==='copy')copy(b.dataset.v,x.copied,x.copyFail);
    else if(a==='lan-on'||a==='lan-off'||a==='lan-pin'){try{LANI=await api('POST','/api/lan',a==='lan-pin'?{newPin:true}:{on:a==='lan-on'});render()}catch(er){toast(errMsg(er))}}
    else if(a==='upd'){UPDING=true;render();try{await api('POST','/api/update');const v0=ME.version;const poll=async()=>{try{const m=await (await fetch('/api/me')).json();if(m.version&&m.version!==v0){sessionStorage.removeItem('shabytLatest');location.reload();return}}catch(e){}setTimeout(poll,2000)};setTimeout(poll,3000)}catch(er){UPDING=false;render();toast(errMsg(er))}}
    else if(a==='mu'){try{await api('POST','/api/music/'+b.dataset.v,{id:+b.dataset.id||0})}catch(er){toast(errMsg(er))}await loadMus();render()}
    else if(a==='test'){const r=await api('POST','/api/test-alert',{d:x.tName,a:Math.max(1000,ME.settings.alert.min,ME.settings.alert.ttsMin),m:x.tMsg});toast(x.testSent(r.listeners))}
    else if(a==='rtest'){const r=await api('POST','/api/test-alert',{kind:'roulette',d:x.tName,a:ME.settings.roulette.min});toast(x.testSent(r.listeners))}
    else if(a==='d-confirm'||a==='d-reject'||a==='d-replay'){b.disabled=true;await api('POST',`/api/donations/${id}/${a.slice(2)}`);if(a==='d-replay')toast(x.testSent(1));await loadDon();render()}
    else if(a==='color'){document.querySelectorAll('[data-a=color]').forEach(c=>c.setAttribute('aria-pressed',c===b));$('al-color').value=b.dataset.v}
    else if(a==='wsel'){ui.wsel=b.dataset.v;render()}
    else if(a==='fxplay'){const sel=$(b.dataset.v);if(sel)playSound(sel.value)}
    else if(a==='fxfile'){playSound('file:'+b.dataset.v)}
    else if(a==='acct-out'){await api('POST','/api/account/logout');await reload();render()}
    else if(a==='addtier'){$('tiers').insertAdjacentHTML('beforeend',tierRow({}))}
    else if(a==='rmtier'){b.closest('.tier').remove()}
    else if(a==='fxrm'){await api('DELETE','/api/media/'+encodeURIComponent(b.dataset.v));await loadMedia();render()}
    else if(a==='tprev'){ui.tp=b.dataset.v;render()}
    else if(a==='treset'){const r=await api('PUT','/api/settings',{top:{reset:b.dataset.v}});ME.settings=r.settings;toast(x.tpResetDone);render()}
    else if(a==='design'){await saveS({design:b.dataset.v})}
    else if(a==='timer'){await saveS({timer:{action:b.dataset.v,minutes:b.dataset.m?+b.dataset.m:+$('tm-min').value,secPer100:+$('tm-sec').value}})}
    else if(a==='rotate'){await api('POST','/api/keys/rotate');await reload();render();toast(x.rotated)}
    else if(a==='unblock'){const bl=ME.settings.mod.blocked.slice();bl.splice(+id,1);await saveS({mod:{...ME.settings.mod,blocked:bl}})}
    else if(a==='buy'){const k=b.dataset.v,box=$('payBox');box.style.display='flex';box.innerHTML=`<h2>${x[k]}</h2><p>${x.payText(fmt(ME.prices[k]),ME.site.kaspi,ME.user.nick)}</p><div><button class="btn gold" data-a="paid" data-v="${k}">${x.paid}</button></div>`;box.scrollIntoView({behavior:'smooth',block:'center'})}
    else if(a==='paid'){await api('POST','/api/plan/request',{plan:b.dataset.v});ME=await api('GET','/api/me');render();toast(x.sentPay)}
  }catch(er){if(er.status===401){ME=null;render()}else toast(errMsg(er))}
});
document.addEventListener('input',e=>{const id=e.target.id;
  if(id==='al-dur')$('durV').textContent=e.target.value;
  if(id==='al-vol')$('volV').textContent=e.target.value;
  if(id==='mu-vol')$('muVolV').textContent=e.target.value;
  if(id==='al-color')document.querySelectorAll('[data-a=color]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.v===e.target.value));
  if(id==='dq'){ui.q=e.target.value;const p=e.target.selectionStart;render();const i=$('dq');i.focus();try{i.setSelectionRange(p,p)}catch(er){}}
});
document.addEventListener('submit',async e=>{e.preventDefault();const id=e.target.id,x=t(),v=i=>$(i).value;
  if(id==='authF'){const reg=authMode==='register';try{if(reg)await api('POST','/api/auth/register',{nick:v('a-nick').trim().toLowerCase(),email:v('a-email').trim(),pass:v('a-pass')});else{const r=await api('POST','/api/auth/login',{login:v('a-login').trim(),pass:v('a-pass')});if(r.role==='admin'){location.href='/admin';return}}await reload();route()}catch(er){$('a-err').textContent=errMsg(er)}return}
  if(id==='muF')return saveS({music:{on:$('mu-on').checked,min:+v('mu-min'),maxSec:+v('mu-max'),approve:$('mu-approve').checked,video:$('mu-video').checked,vol:+v('mu-vol')}});
  if(id==='muAddF'){try{await api('POST','/api/music/add',{url:v('mu-url').trim(),donor:x.muMe});toast(x.muAdded);await loadMus();render()}catch(er){toast(errMsg(er))}return}
  if(id==='acctF'){try{await api('POST','/api/account/login',{login:v('ac-l').trim(),password:v('ac-p')});await reload();await loadMedia();render();toast(x.acOk)}catch(er){toast(errMsg(er))}return}
  if(id==='licF'){try{await api('POST','/api/license',{key:v('lic-key').trim()});await reload();render();toast(x.lpOk)}catch(er){toast(errMsg(er))}return}
  if(id==='alertF')return saveS({alert:{color:v('al-color'),anim:segVal('al-anim'),dur:+v('al-dur'),sound:v('al-sound'),gif:v('al-gif'),tiers:[...document.querySelectorAll('#tiers .tier')].map(r=>({min:+r.querySelector('.t-min').value,sound:r.querySelector('.t-snd').value,gif:r.querySelector('.t-gif').value})),vol:+v('al-vol'),tpl:v('al-tpl'),min:+v('al-min'),tts:$('al-tts').checked,voice:segVal('al-voice'),ttsMin:+v('al-ttsMin')}},false);
  if(id==='wF'){const w=ui.wsel;const data={goal:()=>({goal:{title:v('g-title'),target:+v('g-target'),start:+v('g-start'),reset:$('g-reset').checked}}),top:()=>({top:{n:+v('top-n'),titles:{day:v('tt-day'),month:v('tt-month'),all:v('tt-all')}}}),last:()=>({last:{n:+v('last-n')}}),ticker:()=>({ticker:{n:+v('tk-n'),speed:+v('tk-speed')}}),roulette:()=>({roulette:{min:+v('r-min'),items:v('r-items').split('\n')}})}[w];if(data)return saveS(data(),false);return}
  if(id==='pageF'){const pres=v('p-presets').split(',').map(s=>parseInt(s,10)).filter(n=>n>0),mn=+v('p-min'),mx=+v('p-max');if(!pres.length||!(mn>0)||!(mx>mn)){$('p-err').textContent=x.errs.default;return}return saveS({page:{kaspi:v('p-kaspi'),name:v('p-name'),color:v('p-color'),desc:v('p-desc'),presets:pres,min:mn,max:mx}})}
  if(id==='modF')return saveS({mod:{...ME.settings.mod,words:v('m-words').split(','),links:$('m-links').checked}});
  if(id==='blockF'){const n=v('m-add').trim();if(n)return saveS({mod:{...ME.settings.mod,blocked:[...ME.settings.mod.blocked,n]}})}
});

document.addEventListener('change',async e=>{
  const id=e.target.id;
  if(id==='al-gif'){$('gifpv').innerHTML=fxPreview(e.target.value);return}
  if(id==='fx-up'){const x=t();for(const f of e.target.files){toast(x.fxUploading);try{const r=await fetch('/api/media?name='+encodeURIComponent(f.name),{method:'POST',body:f,credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(j.error||'x'),{status:r.status});toast(x.fxUploaded)}catch(er){toast(errMsg(er))}}await loadMedia();render()}
});
setLang(getLang());
if(location.pathname==='/login'||location.hash==='#register')authMode=location.hash==='#register'?'register':'login';
reload().then(route).then(checkUpd).catch(()=>{ME=null;render()});
// new donations appear without reloading the page
setInterval(async()=>{if(!ME||view!=='music'||document.hidden)return;const sig=JSON.stringify(MUS);await loadMus();if(JSON.stringify(MUS)!==sig&&!document.activeElement.matches('input,textarea,select'))render()},3000);
setInterval(async()=>{
  if(!ME||!(view==='home'||view==='donations'||view==='bridge')||document.hidden)return;
  if(ME.local){try{const m=await api('GET','/api/me');ME.listener=m.listener}catch(e){}}
  if(view==='bridge'){try{HOOKLOG=(await api('GET','/api/hook-log')).rows;if(!document.activeElement.matches('input,textarea'))render()}catch(e){}return}
  try{const sig=JSON.stringify(DON.rows.map(r=>r.id+r.status));await loadDon();
    if(JSON.stringify(DON.rows.map(r=>r.id+r.status))!==sig&&!document.activeElement.matches('input,textarea'))render()}catch(e){}
},10000);
}
</script>
