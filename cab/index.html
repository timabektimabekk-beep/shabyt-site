<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Толық кабинет · Шабыт</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#061820">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#061820;color:#e8f6fa;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px;text-align:center}
.c{max-width:480px}h1{font-size:24px;margin:14px 0 6px}p{color:#9fbcc6;margin:0 0 16px}
.sp{width:44px;height:44px;margin:0 auto;border:4px solid #1d4352;border-top-color:#fec50c;border-radius:50%;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.sp{animation:none}}
a{display:inline-block;margin:6px;padding:12px 18px;border-radius:12px;background:#fec50c;color:#3a2a00;font-weight:700;text-decoration:none}a.g{background:transparent;color:#e8f6fa;border:2px solid #1d4352}
a:focus-visible{outline:3px solid #22c3dd;outline-offset:2px}
</style>
</head>
<body>
<div class="c" id="c" aria-live="polite"><div class="sp" aria-hidden="true"></div><h1 id="h">Кабинет ашылып жатыр…</h1><p id="p">Открываем кабинет…</p></div>
<script>
(async () => {
  const API = 'https://shabyt-api.timabektimabekk.workers.dev';
  const show = (h, p, links) => { document.getElementById('c').innerHTML = `<h1>${h}</h1><p>${p}</p>${links}`; };
  const back = '<a href="/cab/">Қайталау · Повторить</a><a class="g" href="/account/">Кабинет</a>';
  let tok = ''; try { tok = localStorage.getItem('shabyt-token') || ''; } catch (e) { }
  if (!tok) return location.replace('/account/');
  if (!('serviceWorker' in navigator) || !window.caches) return show('Бұл браузер қолдамайды · Браузер не поддерживается', 'Chrome, Edge, Safari немесе Yandex браузерінің жаңа нұсқасын қолданыңыз. · Используйте свежий Chrome, Edge, Safari или Яндекс Браузер.', '<a class="g" href="/account/">Кабинет</a>');
  try {
    const r = await fetch(API + '/relay-status', { headers: { Authorization: 'Bearer ' + tok } });
    if (r.status === 401) { try { localStorage.removeItem('shabyt-token'); } catch (e) { } return location.replace('/account/'); }
    const j = await r.json();
    // program online → its live cabinet; not connected yet → the same cabinet with example data (demo)
    const c = await caches.open('shb-relay');
    await c.put('/cab/__token', new Response(tok));
    await c.put('/cab/__mode', new Response(j.online ? 'live' : 'demo'));
    const reg = await navigator.serviceWorker.register('/cab/sw.js', { scope: '/cab/', updateViaCache: 'none' });
    try { await reg.update(); } catch (e) { }
    const nw = reg.installing || reg.waiting; // a newer service worker: let it take over before the cabinet opens
    if (nw) await new Promise(res => { const t = setTimeout(res, 6000); nw.addEventListener('statechange', () => { if (nw.state === 'activated') { clearTimeout(t); res(); } }); });
    await navigator.serviceWorker.ready;
    location.replace('/cab/app/' + location.hash);
  } catch (e) { show('Қосылу мүмкін болмады · Не удалось подключиться', 'Интернетті тексеріп, қайталаңыз. · Проверьте интернет и повторите.', back); }
})();
</script>
</body>
</html>
