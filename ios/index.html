<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Шабыт · iPhone</title>
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#061820">
<style>
*{box-sizing:border-box}
body{margin:0;background:#061820;color:#e8f6fa;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:20px 16px 40px}
main{max-width:520px;margin:0 auto}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}
p{color:#9fbcc6;margin:0 0 14px}
.card{background:#0c2630;border:1px solid #1d4352;border-radius:16px;padding:16px;margin:14px 0}
code{display:block;word-break:break-all;background:#061820;border:1px solid #1d4352;border-radius:10px;padding:10px;font-size:13px;color:#cfeef6}
button,a.btn{display:block;width:100%;margin-top:10px;padding:14px;border:0;border-radius:12px;background:#fec50c;color:#3a2a00;font:700 16px system-ui,sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.g,a.btn.g{background:transparent;color:#e8f6fa;border:2px solid #1d4352}
ol{margin:0;padding-left:22px;display:grid;gap:10px}li b{color:#fec50c}
.ok{color:#5be39a}.bad{color:#ff8a7a}
.lang{display:flex;gap:6px;justify-content:flex-end}.lang button{width:auto;margin:0;padding:6px 12px;font-size:13px}
:focus-visible{outline:3px solid #22c3dd;outline-offset:2px}
</style>
</head>
<body>
<main id="m"></main>
<script>
(() => {
  // the secret part comes after # and never reaches any server: it is only copied for the Shortcuts app
  const API = 'https://shabyt-api.timabektimabekk.workers.dev';
  const key = (/[#&]k=([\w-]{20,40})/.exec(location.hash) || [])[1] || '';
  const url = key ? `${API}/hook/ios/${key}` : '';
  const SC = 'https://www.icloud.com/shortcuts/48c4de02d3af4e2883e242ba53b8f32a', NAME = 'shabytkzdon';
  const T = {
    kk: { h: 'Шабыт → iPhone', sub: 'Kaspi донаттарын компьютерсіз қабылдау. iOS 27 керек: Kaspi хабарламасы келгенде «Команды» оның мәтінін Шабытқа жібереді.',
      bad: 'Сілтеме толық емес. Панельдегі QR-ды қайта сканерлеңіз.', go: 'Көшіріп, команданы қосу', copy: 'Тек сілтемені көшіру', copied: 'Көшірілді ✓',
      s1: '1. Команданы қосыңыз', s2: '2. Сілтемені қойыңыз', s3: '3. Автоматизацияны қосыңыз',
      a1: ['Жоғарыдағы сары батырманы басыңыз: сілтеме көшіріледі де, команда ашылады.', '<b>«Добавить быструю команду»</b> басыңыз.'],
      a2: ['«Команды» → <b>«shabytkzdon»</b> командасын ашыңыз (немесе іске қосқанда «URL не указан» шықса → <b>«Показать»</b>).', '<b>«URL-адрес»</b> өрісін басып → <b>«Вставить»</b> → «Готово».', 'Осы беттегі <b>«Іске қосу»</b> батырмасын басыңыз → <b>«Разрешить»</b>. Панельдегі «Төлем көпірі» бетінде «iPhone» пайда болады.'],
      a3: ['«Команды» → <b>«Автоматизация»</b>.', '<b>«Когда я получаю уведомление…»</b> қосқышын <b>жасыл</b> қылыңыз. Болды!'],
      run: 'Іске қосу', open: '«Команды» қосымшасын ашу',
      warn: 'Сілтемені ешкімге бермеңіз: оны білген адам жалған донат жібере алады. Жоғалса, панельден жаңасын жасаңыз.' },
    ru: { h: 'Шабыт → iPhone', sub: 'Приём донатов Kaspi без компьютера. Нужен iOS 27: когда приходит уведомление Kaspi, «Команды» отправляют его текст в Шабыт.',
      bad: 'Ссылка неполная. Отсканируйте QR в панели ещё раз.', go: 'Скопировать и добавить команду', copy: 'Только скопировать ссылку', copied: 'Скопировано ✓',
      s1: '1. Добавьте команду', s2: '2. Вставьте ссылку', s3: '3. Включите автоматизацию',
      a1: ['Нажмите жёлтую кнопку выше: ссылка скопируется, и откроется команда.', 'Нажмите <b>«Добавить быструю команду»</b>.'],
      a2: ['«Команды» → откройте <b>«shabytkzdon»</b> (или при запуске появится «URL не указан» → <b>«Показать»</b>).', 'Нажмите поле <b>«URL-адрес»</b> → <b>«Вставить»</b> → «Готово».', 'Нажмите на этой странице <b>«Запустить»</b> → <b>«Разрешить»</b>. В панели на странице «Төлем көпірі» появится «iPhone».'],
      a3: ['«Команды» → <b>«Автоматизация»</b>.', 'Сделайте переключатель <b>«Когда я получаю уведомление…»</b> <b>зелёным</b>. Готово!'],
      run: 'Запустить', open: 'Открыть «Команды»',
      warn: 'Никому не давайте ссылку: зная её, можно отправить ложный донат. Если потеряете — создайте новую в панели.' }
  };
  let lang = (navigator.language || '').startsWith('ru') ? 'ru' : 'kk';
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  const ol = a => `<ol>${a.map(s => `<li>${s}</li>`).join('')}</ol>`;
  const render = () => {
    const x = T[lang];
    document.documentElement.lang = lang;
    document.getElementById('m').innerHTML = `<div class="lang"><button class="${lang === 'kk' ? '' : 'g'}" data-l="kk">ҚАЗ</button><button class="${lang === 'ru' ? '' : 'g'}" data-l="ru">РУС</button></div>
      <h1>${x.h}</h1><p>${x.sub}</p>
      ${!key ? `<div class="card"><p class="bad">${x.bad}</p></div>` : `
      <div class="card"><h2>${x.s1}</h2><code id="u">${esc(url)}</code><button id="go">${x.go}</button><button class="g" id="cp">${x.copy}</button><div style="margin-top:14px">${ol(x.a1)}</div></div>
      <div class="card"><h2>${x.s2}</h2>${ol(x.a2)}<a class="btn g" href="shortcuts://run-shortcut?name=${encodeURIComponent(NAME)}">${x.run}</a></div>
      <div class="card"><h2>${x.s3}</h2>${ol(x.a3)}<a class="btn g" href="shortcuts://">${x.open}</a></div>
      <p>${x.warn}</p>`}`;
  };
  const copy = async () => {
    try { await navigator.clipboard.writeText(url); return true; }
    catch (er) { const r = document.createRange(); r.selectNodeContents(document.getElementById('u')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); try { return document.execCommand('copy'); } catch (er2) { return false; } }
  };
  document.addEventListener('click', async e => {
    const x = T[lang], l = e.target.closest('[data-l]');
    if (l) { lang = l.dataset.l; return render(); }
    if (e.target.id === 'cp') { await copy(); e.target.textContent = x.copied; }
    // one tap: copy the personal link, then open the shared shortcut so the user only has to paste it
    if (e.target.id === 'go') { await copy(); e.target.textContent = x.copied; setTimeout(() => { location.href = SC; }, 350); }
  });
  render();
})();
</script>
</body>
</html>
