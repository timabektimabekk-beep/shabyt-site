    const l = val('l'), p = val('p'), er = document.getElementById('ferr'); er.textContent = '';
    try {
      if (view === 'register') { if (p !== val('p2')) throw { code: 'mismatch' }; const r = await api('POST', '/register', { login: l, password: p, email: val('e') }); setTok(r.token); }
      else { const r = await api('POST', '/login', { login: l, password: p }); setTok(r.token); }
      history.replaceState(null, '', location.pathname); await load();
    } catch (er2) { er.textContent = errText(er2); }
  }
  if (e.target.id === 'pf') {
    const er = document.getElementById('perr'); er.textContent = '';
    try { await api('POST', '/me/password', { old: val('op'), password: val('np') }); toast(x.saved); e.target.reset(); } catch (er2) { er.textContent = errText(er2); }
  }
});
document.addEventListener('click', async e => {
  const v = e.target.closest('[data-v]');
  if (v && v.matches('a[data-v]')) { e.preventDefault(); view = v.dataset.v; history.replaceState(null, '', '#' + view); return render(); }
  const b = e.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'tier') { pick.tier = b.dataset.v; render(); }
  if (a === 'months') { pick.months = +b.dataset.v; render(); }
  if (a === 'promo') { const c = val('pc').trim(); if (!c) return; try { PROMO = await api('POST', '/me/promo', { code: c }); render(); toast(t().promoOk(PROMO.pct)); } catch (er) { toast(errText(er)); } }
  if (a === 'promox') { PROMO = null; render(); }
  if (a === 'paid') { try { await api('POST', '/me/pay', { tier: pick.tier, months: pick.months, note: val('pn'), code: PROMO ? PROMO.code : '' }); PROMO = null; await load(); } catch (er) { if (er && /promo/.test(er.code || '')) PROMO = null; toast(errText(er)); render(); } }
  if (a === 'link') { try { await linkProgram(linkPort()); } catch (er) { toast(errText(er)); } }
  if (a === 'cancel') { try { await api('POST', '/me/pay/cancel'); await load(); } catch (er) { toast(errText(er)); } }
});
document.getElementById('out').onclick = async () => { try { await api('POST', '/logout'); } catch (e) { } setTok(''); D = null; view = 'login'; render(); };
onLang(render);
if (tok()) load(); else render();

watch = setInterval(async () => { if (!tok() || !D || D.online || !D.user.device || document.hidden) return; try { if ((await api('GET', '/relay-status')).online) { if (STAY) { D.online = true; render(); } else location.replace('/cab/'); } } catch (e) { } }, 6000);
